<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>v86 — PC Emulator Spike</title>
<style>
  html, body { height: 100%; margin: 0; background: #000; overflow: hidden; font-family: Tahoma, Verdana, sans-serif; }
  #hud { position: fixed; top: 0; left: 0; right: 0; z-index: 5; display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    padding: 5px 10px; background: rgba(20,20,30,.92); color: #cfe3ff; font-size: 12px;
    transform: translateY(calc(-100% + 7px)); opacity: .25; transition: transform .18s ease, opacity .18s ease; }
  #hud:hover, #hud:focus-within { transform: translateY(0); opacity: 1; }
  #hud-tab { position: fixed; top: 0; left: 50%; transform: translateX(-50%); z-index: 6; padding: 0 12px 2px;
    background: rgba(20,20,30,.75); color: #9db9dd; font-size: 10px; border-radius: 0 0 6px 6px; pointer-events: none; }
  body:has(#hud:hover) #hud-tab, body:has(#hud:focus-within) #hud-tab { display: none; }
  #hud button { background: #2b4a77; color: #fff; border: 1px solid #6ea8ff; padding: 3px 10px; cursor: pointer; }
  #hud .warn { color: #ffd27f; }
  #screen_container { position: absolute; inset: 0; overflow: hidden; background: #000; }
  #screen_container canvas { display: block; margin: 0 auto; }
  #screen_container textarea { display: none; }
  #msg { color: #c0c0c0; padding: 52px 18px 18px; font-size: 14px; line-height: 1.5; }
</style>
</head>
<body>
<div id="hud-tab">⌄ controls</div>
<div id="hud">
  <span id="hud-status">Loading v86…</span>
  <span id="hud-time"></span>
  <span id="hud-fps"></span>
  <span id="hud-ram"></span>
  <span id="hud-net"></span>
  <button id="btn-restart" type="button">Restart PC</button>
  <button id="btn-stop" type="button">Stop</button>
  <button id="btn-screenshot" type="button">📷 Screenshot</button>
  <button id="btn-lock" type="button">🖱 Lock Mouse</button>
  <button id="btn-save-state" type="button">💾 Save State</button>
  <span id="keys">
    <button type="button" data-key="13">⏎ Enter</button>
    <button type="button" data-key="119">F8</button>
    <button type="button" data-key="27">Esc</button>
    <button type="button" data-key="38">↑</button>
    <button type="button" data-key="40">↓</button>
    <button type="button" data-key="37">←</button>
    <button type="button" data-key="39">→</button>
    <button type="button" data-key="32">Space</button>
    <button type="button" id="btn-focus">Focus keyboard</button>
  </span>
  <span class="warn">Press 💾 Save State before closing — otherwise this session is lost</span>
</div>
<div id="lock-badge" style="display:none; position:fixed; bottom:10px; left:50%; transform:translateX(-50%); z-index:7; padding:4px 14px; background:rgba(20,20,30,.85); color:#ffd27f; font-size:12px; border-radius:4px; pointer-events:none">Mouse &amp; keyboard captured — press <b>Right Ctrl</b> or <b>Esc</b> to release</div>
<div id="screen_container"><div id="msg">Loading the PC emulator…</div></div>

<script src="https://cdn.jsdelivr.net/npm/v86@0.5.472/build/libv86.js"></script>
<script>
(function () {
  var statusEl = document.getElementById('hud-status');
  var timeEl = document.getElementById('hud-time');
  var fpsEl = document.getElementById('hud-fps');
  var params = new URLSearchParams(location.search);
  var demo = params.get('demo');
  var RAM_CHOICES = [64, 128, 256, 512, 1024, 2048];
  var ramMB = RAM_CHOICES.includes(Number(params.get('ram'))) ? Number(params.get('ram')) : 128;
  var NET_MODES = { public: 'wisps://wisp.mercurywork.shop/', local: 'wisp://127.0.0.1:12345', private: null, off: null };
  var netMode = Object.prototype.hasOwnProperty.call(NET_MODES, params.get('net')) ? params.get('net') : 'public';
  var netUrl = NET_MODES[netMode];
  if (netMode === 'private') {
    var relayParam = params.get('relay') || '';
    netUrl = /^wss:\/\//.test(relayParam) ? relayParam : null; // token URL minted for Plus users
  }
  var t0 = performance.now();
  var emulator = null;
  var firstFrameMs = null;

  document.getElementById('hud-ram').textContent = 'RAM ' + ramMB + ' MB';
  document.getElementById('hud-net').textContent = netUrl ? ('Network: ' + netMode + ' relay') : 'Network: off';
  function setStatus(t) { statusEl.textContent = t; }
  function fail(t) { setStatus('Failed'); document.getElementById('msg').innerHTML = '<b>The PC could not start.</b><br><br>' + t; }
  if (typeof V86 !== 'function') { fail('The v86 runtime did not load. This feature needs an internet connection.'); return; }

  setInterval(function () { timeEl.textContent = 'elapsed ' + ((performance.now() - t0) / 1000).toFixed(1) + 's'; }, 250);

  // Crude responsiveness probe: main-thread frames + first non-black canvas frame.
  (function fpsLoop() {
    var frames = 0; var start = performance.now();
    function tick() { frames++; if (performance.now() - start >= 2000) { fpsEl.textContent = Math.round(frames / 2) + ' fps (UI)'; frames = 0; start = performance.now(); } requestAnimationFrame(tick); }
    requestAnimationFrame(tick);
  })();
  setInterval(function () {
    if (firstFrameMs !== null) return;
    var screenText = document.querySelector('#screen_container')?.innerText || '';
    if (screenText.trim().length > 10) { firstFrameMs = Math.round(performance.now() - t0); setStatus('Running — first screen at ' + (firstFrameMs / 1000).toFixed(1) + 's. Click the screen, then use keyboard/mouse.'); return; }
    var cv = document.querySelector('#screen_container canvas');
    if (!cv || !cv.width) return;
    try {
      var ctx = cv.getContext('2d');
      var data = ctx.getImageData(0, 0, Math.min(cv.width, 64), Math.min(cv.height, 64)).data;
      for (var i = 0; i < data.length; i += 4) { if (data[i] > 12 || data[i + 1] > 12 || data[i + 2] > 12) { firstFrameMs = Math.round(performance.now() - t0); setStatus('Running — first screen at ' + (firstFrameMs / 1000).toFixed(1) + 's. Click the screen, then use keyboard/mouse.'); return; } }
    } catch (e) { /* canvas not readable yet */ }
  }, 500);

  var stateKey = null;
  var pendingState = null;
  function openDb() {
    return new Promise(function (resolve, reject) {
      var req = indexedDB.open('win98-run-db-v1', 3);
      req.onupgradeneeded = function () {
        var db = req.result;
        if (!db.objectStoreNames.contains('programs')) db.createObjectStore('programs', { keyPath: 'id' });
        if (!db.objectStoreNames.contains('diskimages')) db.createObjectStore('diskimages', { keyPath: 'id' });
        if (!db.objectStoreNames.contains('states')) db.createObjectStore('states', { keyPath: 'id' });
      };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    });
  }
  function stateGet(key) {
    return openDb().then(function (db) {
      return new Promise(function (resolve) {
        var get = db.transaction('states', 'readonly').objectStore('states').get(key);
        get.onsuccess = function () { resolve(get.result || null); };
        get.onerror = function () { resolve(null); };
      });
    }).catch(function () { return null; });
  }
  function statePut(rec) {
    return openDb().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction('states', 'readwrite');
        tx.objectStore('states').put(rec);
        tx.oncomplete = resolve; tx.onerror = function () { reject(tx.error); };
      });
    });
  }
  async function saveMachineState() {
    if (!emulator || !stateKey) { setStatus('Nothing to save in demo mode.'); return; }
    try {
      setStatus('Saving machine state — keep this window open…');
      var buf = await emulator.save_state();
      var blob = new Blob([buf], { type: 'application/octet-stream' });
      await statePut({ id: stateKey, blob: blob, size: blob.size, createdAt: Date.now(), ramMB: ramMB });
      setStatus('State saved (' + (blob.size / 1048576).toFixed(1) + ' MB) at ' + new Date().toLocaleTimeString() + '. It will resume on next boot.');
    } catch (e) { setStatus('Save state failed: ' + (e && e.message ? e.message : 'browser storage error')); }
  }
  window.__win98SaveState = saveMachineState;
  document.getElementById('btn-save-state').onclick = saveMachineState;
  window.addEventListener('pagehide', function () { if (emulator && stateKey) { emulator.save_state().then(function (buf) { statePut({ id: stateKey, blob: new Blob([buf]), size: buf.byteLength, createdAt: Date.now(), ramMB: ramMB }); }).catch(function () {}); } });

  function boot(opts) {
    document.getElementById('msg')?.remove();
    if (pendingState) opts.initial_state = { url: pendingState };
    var settings = {
      screen_container: document.getElementById('screen_container'),
      wasm_path: 'https://cdn.jsdelivr.net/npm/v86@0.5.472/build/v86.wasm',
      bios: { url: 'https://cdn.jsdelivr.net/gh/copy/v86@master/bios/seabios.bin' },
      vga_bios: { url: 'https://cdn.jsdelivr.net/gh/copy/v86@master/bios/vgabios.bin' },
      memory_size: ramMB * 1024 * 1024,
      vga_memory_size: 8 * 1024 * 1024,
      autostart: true
    };
    if (netUrl) settings.net_device = { type: 'ne2k', relay_url: netUrl };
    Object.keys(opts).forEach(function (k) { settings[k] = opts[k]; });
    emulator = new V86(settings);
    emulator.add_listener('emulator-ready', function () { setStatus('Emulator ready at ' + ((performance.now() - t0) / 1000).toFixed(1) + 's — booting…'); });
    emulator.add_listener('emulator-started', function () { setStatus('PC started at ' + ((performance.now() - t0) / 1000).toFixed(1) + 's — booting the disk…'); });
  }

  var mouseLocked = false;
  function updateLockUI() {
    document.getElementById('lock-badge').style.display = mouseLocked ? '' : 'none';
    document.getElementById('btn-lock').textContent = mouseLocked ? '🖱 Unlock Mouse (Right Ctrl)' : '🖱 Lock Mouse';
  }
  function lockMouse() {
    if (!emulator) { setStatus('PC is not running yet.'); return; }
    if (mouseLocked) { document.exitPointerLock(); return; }
    focusKeyboard();
    try {
      var p = emulator.lock_mouse();
      if (p && p.catch) p.catch(function () {
        var sc = document.getElementById('screen_container');
        try {
          var r = sc && sc.requestPointerLock && sc.requestPointerLock();
          if (r && r.catch) r.catch(function (err) { setStatus('Mouse lock was blocked (' + (err && err.name ? err.name : 'browser policy') + ') — click Lock Mouse again, or allow pointer lock for this site.'); });
        } catch (err) { setStatus('Mouse lock was blocked (' + (err && err.name ? err.name : 'browser policy') + ').'); }
      });
    } catch (e) { setStatus('Mouse lock is not available in this browser.'); }
  }
  window.__win98LockMouse = lockMouse;
  document.getElementById('btn-lock').onclick = lockMouse;
  document.addEventListener('pointerlockchange', function () {
    mouseLocked = !!document.pointerLockElement;
    updateLockUI();
    setStatus(mouseLocked ? 'Mouse locked — Right Ctrl or Esc releases it.' : 'Mouse released.');
  });
  window.addEventListener('keydown', function (e) {
    if (mouseLocked && e.code === 'ControlRight') { e.preventDefault(); e.stopPropagation(); document.exitPointerLock(); }
  }, true);
  document.getElementById('btn-screenshot').onclick = function () {
    if (!emulator) { setStatus('PC is not running yet.'); return; }
    try {
      var shot = emulator.screen_make_screenshot();
      var url = null;
      if (shot && shot.tagName === 'CANVAS') url = shot.toDataURL('image/png');
      else if (shot && shot.src) url = shot.src;
      if (!url) { setStatus('Screenshot is not ready yet — try again in a second.'); return; }
      var a = document.createElement('a');
      var stamp = new Date().toISOString().replace(/[:.]/g, '-').replace('T', '_').slice(0, 19);
      a.href = url;
      a.download = 'win98-run-screenshot-' + stamp + '.png';
      document.body.append(a);
      a.click();
      a.remove();
      setStatus('Screenshot saved to your Downloads folder.');
    } catch (e) { setStatus('Screenshot failed in this browser.'); }
  };
  document.getElementById('btn-restart').onclick = function () { location.reload(); };
  document.getElementById('btn-stop').onclick = function () { if (emulator) { emulator.stop(); setStatus('Stopped.'); } };

  function focusKeyboard() {
    window.focus();
    try { emulator && emulator.keyboard_set_enabled(true); } catch (e) {}
    var sc = document.getElementById('screen_container');
    if (sc) {
      sc.setAttribute('tabindex', '0');
      sc.focus({ preventScroll: true });
      var ta = sc.querySelector('textarea');
      if (ta) ta.focus({ preventScroll: true });
      var cv = sc.querySelector('canvas');
      if (cv) { cv.setAttribute('tabindex', '0'); cv.focus({ preventScroll: true }); }
    }
    setStatus('Keyboard focused — type now, or use the Enter/F8 buttons above.');
  }
  function sendKey(code) {
    if (!emulator) { setStatus('PC is not running yet.'); return; }
    try { emulator.keyboard_set_enabled(true); emulator.keyboard_send_keys([code]); } catch (e) { setStatus('Could not send that key.'); }
    focusKeyboard();
  }
  window.__win98SendKey = sendKey;
  window.__win98FocusKeyboard = focusKeyboard;
  document.getElementById('keys').addEventListener('click', function (e) {
    var b = e.target.closest('[data-key]');
    if (b) { sendKey(Number(b.dataset.key)); return; }
    if (e.target.id === 'btn-focus') focusKeyboard();
  });
  document.getElementById('screen_container').addEventListener('pointerdown', function () { focusKeyboard(); if (!mouseLocked && emulator) lockMouse(); });
  document.addEventListener('click', function () { try { emulator && emulator.keyboard_set_enabled(true); } catch (e) {} });

  if (demo) {
    setStatus('Loading FreeDOS floppy demo…');
    boot({ fda: { url: 'assets/freedos722.img' } });
    return;
  }

  function bootInstall(rec) {
    var sizeGB = [4, 8, 12].includes(rec.diskSizeGB) ? rec.diskSizeGB : 8;
    var sizeBytes = sizeGB * 1024 * 1024 * 1024;
    setStatus('Creating a blank ' + sizeGB + ' GB disk and booting the installer CD… Do not close this window during install.');
    var chunk = new ArrayBuffer(8 * 1024 * 1024);
    var parts = [];
    for (var i = 0; i < sizeBytes / chunk.byteLength; i++) parts.push(chunk);
    var blankDisk = new Blob(parts, { type: 'application/octet-stream' });
    boot({
      hda: { url: URL.createObjectURL(blankDisk), async: true, size: sizeBytes },
      cdrom: { url: URL.createObjectURL(rec.isoBlob) },
      boot_order: 0x213
    });
  }

  if (params.get('install')) {
    stateKey = 'install:state';
    var ireq = indexedDB.open('win98-run-db-v1', 3);
    ireq.onerror = function () { fail('Could not open local storage.'); };
    ireq.onsuccess = function () {
      var get = ireq.result.transaction('diskimages', 'readonly').objectStore('diskimages').get('install');
      get.onerror = function () { fail('Could not read the installer ISO.'); };
      get.onsuccess = function () {
        var rec = get.result;
        if (!rec || !rec.isoBlob) { fail('No installer ISO found. Use Install Windows from ISO in the Win98 Image window first.'); return; }
        setStatus('Installer: ' + rec.isoName);
        if (params.get('fresh')) { bootInstall(rec); return; }
        stateGet(stateKey).then(function (st) {
          if (st && st.blob) { pendingState = URL.createObjectURL(st.blob); setStatus('Resuming saved state from ' + new Date(st.createdAt).toLocaleString() + ' — use Boot fresh to restart the install.'); }
          bootInstall(rec);
        });
      };
    };
    return;
  }

  var req = indexedDB.open('win98-run-db-v1', 3);
  req.onupgradeneeded = function () {
    var db = req.result;
    if (!db.objectStoreNames.contains('programs')) db.createObjectStore('programs', { keyPath: 'id' });
    if (!db.objectStoreNames.contains('diskimages')) db.createObjectStore('diskimages', { keyPath: 'id' });
    if (!db.objectStoreNames.contains('states')) db.createObjectStore('states', { keyPath: 'id' });
  };
  req.onerror = function () { fail('Could not open local storage.'); };
  req.onsuccess = function () {
    var get = req.result.transaction('diskimages', 'readonly').objectStore('diskimages').get(params.get('img') || 'last');
    get.onerror = function () { fail('Could not read the disk image.'); };
    get.onsuccess = function () {
      var rec = get.result;
      if (!rec || !rec.blob) { fail('No disk image found. Import a Windows 98 .img from the Win98 Image (v86) window first.'); return; }
      var opts = {};
      var url = URL.createObjectURL(rec.blob);
      if (rec.kind === 'fda') opts.fda = { url: url }; else opts.hda = { url: url, async: true };
      if (rec.isoBlob) opts.cdrom = { url: URL.createObjectURL(rec.isoBlob) };
      stateKey = (params.get('img') || 'last') + ':state';
      setStatus('Booting ' + rec.name + ' (' + (rec.kind === 'fda' ? 'floppy' : 'hard disk') + (rec.isoName ? ', CD: ' + rec.isoName : '') + ')…');
      if (params.get('fresh')) { boot(opts); return; }
      stateGet(stateKey).then(function (st) {
        if (st && st.blob) { pendingState = URL.createObjectURL(st.blob); setStatus('Resuming saved state from ' + new Date(st.createdAt).toLocaleString() + ' — use Boot fresh to start from the disk image.'); }
        boot(opts);
      });
    };
  };
})();
</script>
</body>
</html>
